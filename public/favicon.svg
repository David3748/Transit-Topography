<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mirrors .app-brand-mark: teal→gold→coral sweep with a white diagonal stripe -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.52" stop-color="#d79b18"/>
      <stop offset="1" stop-color="#e85d3f"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#sweep)"/>
  <g clip-path="url(#rounded)">
    <path d="M -10 49 L 49 -10 L 58 -1 L -1 58 Z" fill="rgba(255,255,255,0.38)"/>
    <!-- Contour rings — the topography motif -->
    <circle cx="22" cy="42" r="7" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.4"/>
    <circle cx="22" cy="42" r="13.5" fill="none" stroke="rgba(255,255,255,0.34)" stroke-width="2.2"/>
    <circle cx="22" cy="42" r="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="22" cy="42" r="2.8" fill="#ffffff"/>
  </g>
</svg>
